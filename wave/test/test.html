<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Superposition</title>

<style>
</style>
<link type="text/css" rel="stylesheet" href="../../css/slider.css"/>
<link type="text/css" rel="stylesheet" href="../../css/menu.css"/>

<!-- Javascript -->

<!-- Three -->
		<script type="importmap">
		{ "imports": { "three": "../../js/vendor/three/build/three.module.min.js" } }
		</script>

<!-- Main script -->
<script type="module">
import { slider, setSliderValue } from '../../js/common/ui.js';

const x = 10;
const x1 = 2;
const x2 = x - x1;

slider('slider1', {
	min: 0,
	max: 10,
	step: 1,
	value: x1,
	callOnInit: true,
	onInput: (value) => {
		document.getElementById("input1").value = value;
		document.getElementById("input2").value = x - value;
		setSliderValue('slider2', x - value);
	}
});

document.getElementById("input1").addEventListener('change', (event) => {
	setSliderValue('slider1', event.target.value);
});

slider('slider2', {
	min: 0,
	max: 10,
	step: 1,
	value: x2,
	callOnInit: true,
	onInput: (value) => {
		document.getElementById("input2").value = value;
	}
});

document.getElementById("input2").addEventListener('change', (event) => {
	setSliderValue('slider2', event.target.value);
});
</script>
</head>
<body>
	<input type="range" id="slider1" class="slider">
	<input type="text" value="" id="input1"></input>
	<input type="range" id="slider2" class="slider">
	<input type="text" value="" id="input2" class="number" ></input>
</body>
</html>
