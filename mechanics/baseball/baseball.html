<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8"/>
		<title>double pendulum</title>

		<!-- style sheet -->
		<link type="text/css" rel="stylesheet" href="../../css/slider.css"/>
		<link type="text/css" rel="stylesheet"
		href="../../css/menu.css" rel="stylesheet"/>
		<style>
			/* キャンバス要素のスタイル*/
			div#canvas-frame{
				width: 900px;
				height: 600px;
			}

			/* スライダーのスタイル*/
			input.slider{
				width: 200px
			}

			/* テキストボックスのスタイル*/
			input#number{
				width: 30px;
			}

		</style>

		<!-- Javascript -->


		<!-- Three -->
		<script type="importmap">
		{ "imports": { "three": "../../js/vendor/three/build/three.module.min.js" } }
		</script>

		<!-- Main script -->
		<script type="module" src="./baseball.js"></script>
	</head>
	<body>
		<ul id="normal" class="dropmenu">
			<!-- button -->
			<div id="buttonFrame">
				<li><a href="#">
						<input class="button" type="button" value="Stop" id="stopButton" />
					</a>
				</li>
				<li><a href="#">
						<input class="button" type="button" value="Set" id="startButton" />
					</a>
				</li>
			</div>
			<li><a href="#">粒子の設定</a>
				<ul>
					<!-- mass -->
					<li>
						<a href="#">
							<table>
								<tr>
									<td>質量1</td>
									<td><input type="range" id="slider_mass_ball" class="slider" style="width:180px"></td>
									<td><input type="text" value="" id="input_mass_ball" class="number" style="width:20px">kg</td>
								</tr>
							</table>
						</a>
					</li>
					<li>
						<a href="#">
							<table>
								<tr>
									<td>質量2</td>
									<td><div id="slider_mass2" class="slider" style="width:180px"></div></td>
									<td><input type="text" value="" id="input_mass2" class="number" style="width:20px">kg</td>
								</tr>
							</table>
						</a>
					</li>
				</ul>
			</li>
			<li><a href="#">表示</a>
				<ul>
					<li>
						<a href="#">
							<p>軌跡<input type="checkbox" checked="checked" id="checkbox_contour" /></p>
						</a>
					</li>
				</ul>
			</li>
			<li><a href="#">時間<span id="time">0</span>s</a>
				<ul>
					<li>
						<a href="#"> dt
							<input type="text" value="" id="input_Dt" class="number" style="width:180px"/>
						</a>
					</li>
					<li>
						<a href="#">
							<table>
								<tr>
									<td>描画倍率</td>
									<td><center><input type="range" id="slider_skip" class="slider" style="width:180px"></center></td>
									<td><input type="text" value="" id="input_skip" class="number" style="width:25px"/></td>
								</tr>
							</table>
						</a>
					</li>
				</ul>
			</li>
		</ul>
		<!-- frame -->
		<div id="canvas-frame"></div>

		<!-- controller -->
		<div id="controller" >

		</div>
			<div style="margin:30px 0px;">
			</div>
	</body>
</html>
